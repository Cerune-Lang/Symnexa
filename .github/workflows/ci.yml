name: Rust ELF64 linker

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test-and-liseos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: Symnexa
      - uses: actions/checkout@v4
        with:
          repository: Cerune-Lang/LiseOS
          path: LiseOS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Unit tests
        working-directory: Symnexa
        run: |
          cargo fmt --all
          cargo clippy --all-targets
          cargo test
      - name: Install boot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lld xorriso qemu-system-x86 gdb
      - name: Build Cerune object and reference ELF
        working-directory: LiseOS
        run: bash scripts/build.sh
      - name: Link with Symnexa
        run: |
          cargo run --manifest-path Symnexa/Cargo.toml -- link --liseos -o LiseOS/build/liseos.elf LiseOS/build/kernel.o
          python3 LiseOS/scripts/audit_elf.py --kernel LiseOS/build/liseos.elf
      - name: Build Symnexa boot ISO and verify QEMU entry
        working-directory: LiseOS
        run: bash ../Symnexa/scripts/liseos-smoke.sh
      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liseos-boot
          path: |
            LiseOS/build/gdb-smoke.log
            LiseOS/build/qemu-smoke.log
            LiseOS/build/qemu-debug.log
            LiseOS/build/qemu-monitor-dump.log
          if-no-files-found: ignore
